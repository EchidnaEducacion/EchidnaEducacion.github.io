- { id: bloques-de-construccion, name: Bloques de construcción, parent: proyectos }
- { id: noticias, name: Noticias }
- { id: talleres, name: Talleres }
- { id: publicaciones, name: Publicaciones }
- { id: inteligencia-artificial, name: Inteligencia Artificial }
